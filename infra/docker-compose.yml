services:
  docs:
    build:
      context: ..
      dockerfile: infra/Dockerfile.docs
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    profiles: ["reference"]
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  reference-api:
    profiles: ["reference"]
    build:
      context: ..
      dockerfile: examples/fastify/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3100
      REDIS_URL: redis://redis:6379
      PORTABLE_COLLECTION_ISSUER: http://localhost:3100
      PORTABLE_COLLECTION_WEB_ORIGIN: http://localhost:3100
      PORTABLE_COLLECTION_PRIVATE_KEY_BASE64: ${PORTABLE_COLLECTION_PRIVATE_KEY_BASE64}
      PORTABLE_COLLECTION_TRUSTED_CLIENTS: ${PORTABLE_COLLECTION_TRUSTED_CLIENTS:-}
      PORTABLE_COLLECTION_TRUSTED_ISSUERS: ${PORTABLE_COLLECTION_TRUSTED_ISSUERS:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3100:3100"
