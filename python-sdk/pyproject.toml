[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikicard-portable-collection"
version = "1.0.0"
description = "Python reference SDK for the WikiCard Portable Collection Protocol"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0.0",
  "httpx>=0.28.1",
  "pydantic>=2.11.0",
  "redis>=6.4.0",
  "rfc8785>=0.1.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
