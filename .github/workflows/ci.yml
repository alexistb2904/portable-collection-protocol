name: Protocol CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile --allow-build=esbuild

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm -r test

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile --allow-build=esbuild

      - name: Build docs
        run: pnpm docs:build

  python-sdk:
    name: Python SDK ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python-sdk[dev]"
          pip check

      - name: Tests
        run: pytest python-sdk/tests

      - name: Compile SDK
        run: python -m compileall python-sdk/src

  python-examples:
    name: Python examples
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install examples
        run: |
          python -m pip install --upgrade pip
          (cd examples/python-fastapi && pip install -r requirements.txt)
          (cd examples/python-flask && pip install -r requirements.txt)
          (cd examples/python-django && pip install -r requirements.txt)
          pip check

      - name: Compile examples
        run: |
          python -m compileall examples/python-fastapi
          python -m compileall examples/python-flask
          python -m compileall examples/python-django
